<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="shirtBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3436"/>
      <stop offset="55%" stop-color="#1e2426"/>
      <stop offset="100%" stop-color="#111415"/>
    </linearGradient>
    <linearGradient id="shirtHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d4649" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1e2426" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="neonStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b6ff2b"/>
      <stop offset="100%" stop-color="#7cd400"/>
    </linearGradient>
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <!-- Collar back -->
    <path d="M150 56 C175 74 225 74 250 56 L262 66 C230 92 170 92 138 66 Z" fill="#131718"/>
    <!-- Shirt main silhouette -->
    <path d="M150 56 L92 78 L42 152 L92 184 L116 142 L116 346 C116 352 121 356 128 356 L272 356 C279 356 284 352 284 346 L284 142 L308 184 L358 152 L308 78 L250 56 C234 79 166 79 150 56 Z" fill="url(#shirtBody)"/>
    <!-- Athletic chest shading & raglan seams -->
    <path d="M116 142 L150 56 C166 79 234 79 250 56 L284 142 L284 235 C235 248 165 248 116 235 Z" fill="url(#shirtHighlight)"/>
    <path d="M150 56 L116 142" stroke="#3c4548" stroke-width="2" fill="none"/>
    <path d="M250 56 L284 142" stroke="#3c4548" stroke-width="2" fill="none"/>
    <!-- Crew collar trim -->
    <path d="M148 56 C166 86 234 86 252 56" stroke="#3c4548" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Brand chest emblem -->
    <rect x="228" y="128" width="32" height="5" rx="2.5" fill="url(#neonStripe)"/>
    <text x="244" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5" fill="#e2e8f0">GYMTECH</text>
    <!-- Side breathable mesh panels -->
    <path d="M116 185 L126 195 L126 342 L116 342 Z" fill="#171b1c"/>
    <path d="M284 185 L274 195 L274 342 L284 342 Z" fill="#171b1c"/>
    <line x1="120" y1="340" x2="280" y2="340" stroke="#363e41" stroke-width="2"/>
  </g>
</svg>
