<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="chalkBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="blackCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#52525b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="lcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#lcShadow)">
    <!-- Flip-Top Squeeze Cap with Carabiner Loop -->
    <rect x="175" y="42" width="50" height="28" rx="4" fill="url(#blackCap)" stroke="#18181b" stroke-width="1.5"/>
    <rect x="185" y="32" width="30" height="12" rx="3" fill="#27272a"/>
    <!-- Carabiner Clip Hole -->
    <path d="M225 50 C238 50 242 62 235 70 L225 70" fill="none" stroke="#52525b" stroke-width="3"/>
    
    <!-- Squeeze Bottle Body -->
    <path d="M172 70 L146 115 C136 135 136 170 140 210 L140 335 C140 350 152 362 168 362 L232 362 C248 362 260 350 260 335 L260 210 C264 170 264 135 254 115 L228 70 Z" fill="url(#chalkBottle)" stroke="#94a3b8" stroke-width="2"/>

    <!-- Chalk Handprint Silhouette in Center -->
    <g fill="#94a3b8" fill-opacity="0.35">
      <!-- Palm -->
      <ellipse cx="200" cy="180" rx="20" ry="18"/>
      <!-- Fingers -->
      <path d="M185 168 L176 135 C175 130 182 128 185 133 L190 166 Z"/>
      <path d="M195 164 L193 125 C193 120 201 120 202 125 L200 164 Z"/>
      <path d="M205 165 L210 128 C211 123 219 125 218 130 L210 167 Z"/>
      <path d="M214 170 L225 142 C228 138 234 142 232 146 L218 174 Z"/>
      <!-- Thumb -->
      <path d="M182 182 L164 175 C160 174 160 180 164 183 L180 190 Z"/>
    </g>

    <!-- Label Banner -->
    <rect x="148" y="215" width="104" height="110" rx="6" fill="#18181b"/>
    <text x="200" y="238" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">LIQUID</text>
    <text x="200" y="256" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#38bdf8" letter-spacing="1">CHALK</text>
    
    <line x1="162" y1="266" x2="238" y2="266" stroke="#52525b" stroke-width="1"/>
    
    <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="7.5" fill="#e2e8f0">MAXIMUM GRIP</text>
    <text x="200" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="7" fill="#94a3b8">SWEAT RESISTANT</text>
    
    <rect x="168" y="302" width="64" height="15" rx="3" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
    <text x="200" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#38bdf8">250 ml</text>
  </g>
</svg>