<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="rtdBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="chocGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c3826"/>
      <stop offset="50%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#241309"/>
    </linearGradient>
    <linearGradient id="blueCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="rtdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#rtdShadow)">
    <!-- Blue Cap -->
    <rect x="175" y="45" width="50" height="26" rx="4" fill="url(#blueCap)" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="184" y1="48" x2="184" y2="67" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="192" y1="48" x2="192" y2="67" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="200" y1="48" x2="200" y2="67" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="208" y1="48" x2="208" y2="67" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="216" y1="48" x2="216" y2="67" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Bottle Shape -->
    <path d="M172 71 L152 110 L152 345 C152 358 162 366 175 366 L225 366 C238 366 248 358 248 345 L248 110 L228 71 Z" fill="url(#rtdBody)" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Brand Cyan Stripe -->
    <rect x="152" y="115" width="96" height="12" fill="#0284c7"/>
    <!-- Brand Logo -->
    <text x="200" y="152" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="13" fill="#0f172a" letter-spacing="1">MYPROTEIN</text>
    <text x="200" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#64748b" letter-spacing="1.5">READY TO DRINK</text>
    <!-- 30g Protein Badge -->
    <circle cx="200" cy="214" r="32" fill="#0284c7"/>
    <circle cx="200" cy="214" r="29" fill="#0369a1"/>
    <text x="200" y="213" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#ffffff">30g</text>
    <text x="200" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#38bdf8">PROTEIN</text>
    <!-- Chocolate Splash Bottom -->
    <path d="M152 270 Q176 250 200 275 T248 265 L248 345 C248 358 238 366 225 366 L175 366 C162 366 152 358 152 345 Z" fill="url(#chocGradient)"/>
    <!-- Splash wave drops -->
    <circle cx="178" cy="254" r="4" fill="#5c3826"/>
    <circle cx="225" cy="250" r="3" fill="#5c3826"/>
    <!-- Chocolate Text -->
    <text x="200" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1">CHOCOLATE</text>
    <text x="200" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#fcd34d">ZERO FAT • NO SUGAR</text>
    <text x="200" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="7.5" fill="#cbd5e1">330 ml</text>
  </g>
</svg>