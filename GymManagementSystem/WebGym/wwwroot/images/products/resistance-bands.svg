<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bandBlack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="bandRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="bandBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bandGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="bandYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="rbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#rbShadow)">
    <!-- 1. Black Band (X-Heavy) - Bottom/Back layer -->
    <g transform="translate(0, 0)">
      <ellipse cx="200" cy="95" rx="135" ry="32" fill="none" stroke="url(#bandBlack)" stroke-width="26"/>
      <text x="200" y="99" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1">X-HEAVY • 30-40 LBS</text>
    </g>

    <!-- 2. Red Band (Heavy) -->
    <g transform="translate(0, 50)">
      <ellipse cx="200" cy="95" rx="135" ry="32" fill="none" stroke="url(#bandRed)" stroke-width="26"/>
      <text x="200" y="99" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1">HEAVY • 25-30 LBS</text>
    </g>

    <!-- 3. Blue Band (Medium) -->
    <g transform="translate(0, 100)">
      <ellipse cx="200" cy="95" rx="135" ry="32" fill="none" stroke="url(#bandBlue)" stroke-width="26"/>
      <text x="200" y="99" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1">MEDIUM • 15-20 LBS</text>
    </g>

    <!-- 4. Green Band (Light) -->
    <g transform="translate(0, 150)">
      <ellipse cx="200" cy="95" rx="135" ry="32" fill="none" stroke="url(#bandGreen)" stroke-width="26"/>
      <text x="200" y="99" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#ffffff" letter-spacing="1">LIGHT • 10-15 LBS</text>
    </g>

    <!-- 5. Yellow Band (X-Light) - Top/Front layer -->
    <g transform="translate(0, 200)">
      <ellipse cx="200" cy="95" rx="135" ry="32" fill="none" stroke="url(#bandYellow)" stroke-width="26"/>
      <text x="200" y="99" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="9" fill="#713f12" letter-spacing="1">X-LIGHT • 5-10 LBS</text>
    </g>

    <!-- Badge at Bottom -->
    <rect x="130" y="338" width="140" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="200" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="10.5" fill="#38bdf8" letter-spacing="1">SET 5 MINI BANDS</text>
  </g>
</svg>