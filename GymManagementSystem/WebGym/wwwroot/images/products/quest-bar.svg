<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5b"/>
      <stop offset="60%" stop-color="#19458f"/>
      <stop offset="100%" stop-color="#0c2249"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#091a38"/>
      <stop offset="100%" stop-color="#123166"/>
    </linearGradient>
    <linearGradient id="barChoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c69c6d"/>
      <stop offset="50%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#8c6239"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Box Side (3D) -->
    <polygon points="78,96 122,74 122,272 78,296" fill="url(#boxSide)" rx="6"/>
    <!-- Box Top -->
    <polygon points="78,96 122,74 328,74 284,96" fill="#2155ad"/>
    <!-- Box Front -->
    <rect x="78" y="96" width="212" height="200" rx="8" fill="url(#boxFront)"/>
    <!-- White header accent -->
    <rect x="92" y="112" width="184" height="58" rx="8" fill="#ffffff"/>
    <text x="184" y="139" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="24" fill="#0f2b5b" letter-spacing="1">QUEST</text>
    <text x="184" y="159" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#2563eb" letter-spacing="2">PROTEIN BAR</text>
    <!-- 21g Protein badge -->
    <circle cx="136" cy="218" r="28" fill="#38bdf8"/>
    <text x="136" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="17" fill="#0f172a">21g</text>
    <text x="136" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#0f172a">PROTEIN</text>
    <!-- Macro badges -->
    <rect x="178" y="192" width="90" height="20" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <text x="223" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#ffffff">1g SUGAR</text>
    <rect x="178" y="218" width="90" height="20" rx="4" fill="#ffffff" fill-opacity="0.15"/>
    <text x="223" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#ffffff">12 BARS x 60g</text>
    <rect x="92" y="264" width="184" height="18" rx="4" fill="#f59e0b"/>
    <text x="184" y="277" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="9.5" fill="#1e293b">CHOCOLATE CHIP COOKIE DOUGH</text>
    <!-- Foreground unwrapped bar -->
    <g transform="rotate(-7 235 316)">
      <rect x="132" y="294" width="206" height="48" rx="10" fill="url(#barChoc)" stroke="#6b4423" stroke-width="2"/>
      <!-- Chocolate chips -->
      <circle cx="164" cy="312" r="5.5" fill="#3e2723"/>
      <circle cx="195" cy="326" r="6" fill="#3e2723"/>
      <circle cx="228" cy="309" r="5" fill="#3e2723"/>
      <circle cx="262" cy="324" r="6.5" fill="#3e2723"/>
      <circle cx="298" cy="313" r="5.5" fill="#3e2723"/>
      <circle cx="182" cy="306" r="4" fill="#4e342e"/>
      <circle cx="246" cy="328" r="4" fill="#4e342e"/>
      <circle cx="315" cy="328" r="4.5" fill="#4e342e"/>
    </g>
  </g>
</svg>
