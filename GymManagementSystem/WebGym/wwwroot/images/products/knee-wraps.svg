<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="wrapFabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="redStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="kwShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#kwShadow)">
    <!-- Rolled Knee Wrap (Tight cylinder roll with visible layers) -->
    <!-- Outer Rolled Cylinder Base -->
    <path d="M120 110 C120 75 190 60 255 75 C320 90 325 140 295 180 L185 320 C145 355 85 325 80 270 L120 110 Z" fill="url(#wrapFabric)" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Top Face of Roll (Spiral Rings) -->
    <ellipse cx="230" cy="115" rx="75" ry="42" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <ellipse cx="230" cy="115" rx="60" ry="33" fill="#27272a" stroke="#dc2626" stroke-width="3"/>
    <ellipse cx="230" cy="115" rx="42" ry="23" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
    <ellipse cx="230" cy="115" rx="25" ry="14" fill="#27272a" stroke="#dc2626" stroke-width="3"/>
    <ellipse cx="230" cy="115" rx="10" ry="6" fill="#09090b"/>

    <!-- Unrolled Tail Extending Down (Elastic Cotton Ribbed Texture) -->
    <path d="M165 145 L110 320 L195 350 L250 175 Z" fill="url(#wrapFabric)" stroke="#3f3f46" stroke-width="2"/>
    
    <!-- Dual Red Racing Powerlifting Stripes along the wrap -->
    <path d="M185 152 L132 327 L152 334 L205 160 Z" fill="url(#redStripe)"/>
    <path d="M210 162 L158 337 L178 344 L230 169 Z" fill="url(#redStripe)"/>

    <!-- Elastic Ribbed Ridge Lines -->
    <line x1="150" y1="200" x2="235" y2="230" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="140" y1="230" x2="225" y2="260" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="130" y1="260" x2="215" y2="290" stroke="#3f3f46" stroke-width="1.5"/>
    <line x1="120" y1="290" x2="205" y2="320" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Velcro Patch at End of Tail -->
    <g transform="rotate(18 155 315)">
      <rect x="110" y="285" width="90" height="42" rx="4" fill="#09090b" stroke="#71717a" stroke-width="1.5"/>
      <text x="155" y="303" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#ef4444" letter-spacing="1">AOLIKES</text>
      <text x="155" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#ffffff" letter-spacing="1">KNEE WRAPS 2M</text>
    </g>
  </g>
</svg>