<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="aquaBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="aquaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="whiteCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <filter id="aqShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#aqShadow)">
    <!-- White Grooved Cap -->
    <rect x="176" y="44" width="48" height="24" rx="3" fill="url(#whiteCap)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="184" y1="46" x2="184" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="192" y1="46" x2="192" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="200" y1="46" x2="200" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="208" y1="46" x2="208" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="216" y1="46" x2="216" y2="65" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="172" y="68" width="56" height="8" rx="2" fill="#bae6fd"/>
    
    <!-- Ribbed Ergonomic Water Bottle Silhouette -->
    <path d="M174 76 L158 120 C146 140 146 160 152 185 C156 205 150 230 144 255 L144 340 C144 354 154 366 168 366 L232 366 C246 366 256 354 256 340 L256 255 C250 230 244 205 248 185 C254 160 254 140 242 120 L226 76 Z" fill="url(#aquaBottle)" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Water Rings / Grips -->
    <path d="M145 135 Q200 145 255 135" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <path d="M144 320 Q200 330 256 320" stroke="#38bdf8" stroke-width="2" fill="none"/>

    <!-- Aquafina Blue Label -->
    <rect x="146" y="180" width="108" height="110" fill="url(#aquaBlue)"/>
    
    <!-- Mountain Peak Graphic in Red / Yellow / White -->
    <polygon points="200,192 180,214 220,214" fill="#ef4444"/>
    <polygon points="200,192 188,206 212,206" fill="#facc15"/>
    <polygon points="200,192 194,199 206,199" fill="#ffffff"/>

    <!-- Aquafina Typography -->
    <text x="200" y="235" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="14.5" fill="#ffffff" letter-spacing="1">AQUAFINA</text>
    
    <!-- Purity Badge -->
    <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="7.5" fill="#bae6fd" letter-spacing="1">PURIFIED WATER</text>
    <rect x="168" y="258" width="64" height="13" rx="3" fill="#ffffff" fill-opacity="0.2"/>
    <text x="200" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#ffffff">500 ml</text>

    <!-- Water Ice Drops / Condensation -->
    <circle cx="155" cy="150" r="3" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="158" cy="158" r="2" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="245" cy="152" r="3.5" fill="#ffffff" fill-opacity="0.8"/>
    <circle cx="242" cy="305" r="3" fill="#38bdf8" fill-opacity="0.5"/>
  </g>
</svg>