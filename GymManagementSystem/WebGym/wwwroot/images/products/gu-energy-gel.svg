<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="gelBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#78350f"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="orangeAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="ggShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#ggShadow)">
    <!-- Iconic Tapered Energy Gel Sachet Shape (Narrow neck with tear notches) -->
    <!-- Packet Outline -->
    <path d="M175 45 L225 45 L225 75 L245 95 L255 125 L255 350 L145 350 L145 125 L155 95 L175 75 Z" fill="url(#gelBody)" stroke="#f97316" stroke-width="2"/>

    <!-- Top Sealed Tear-Off Spout -->
    <rect x="175" y="45" width="50" height="28" fill="#291202"/>
    <line x1="175" y1="58" x2="225" y2="58" stroke="#f97316" stroke-width="1.5" stroke-dasharray="3 2"/>
    <!-- Left Tear Notch -->
    <polygon points="175,54 182,58 175,62" fill="#f8fafc"/>
    <!-- Right Tear Notch -->
    <polygon points="225,54 218,58 225,62" fill="#f8fafc"/>

    <!-- Metallic Heat-Seal Texture at Bottom -->
    <rect x="145" y="338" width="110" height="12" fill="#291202"/>
    <line x1="145" y1="341" x2="255" y2="341" stroke="#78350f" stroke-width="1.5"/>
    <line x1="145" y1="344" x2="255" y2="344" stroke="#78350f" stroke-width="1.5"/>
    <line x1="145" y1="347" x2="255" y2="347" stroke="#78350f" stroke-width="1.5"/>

    <!-- GU Brand Circle & Lettering -->
    <circle cx="200" cy="148" r="32" fill="#ffffff"/>
    <text x="200" y="161" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#ea580c">GU</text>

    <!-- Roctane / Energy Gel Typography -->
    <rect x="155" y="195" width="90" height="22" rx="4" fill="#0f172a"/>
    <text x="200" y="210" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#f97316" letter-spacing="1.5">ROCTANE</text>

    <text x="200" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">ENERGY GEL</text>
    
    <!-- Flavor & Nutrient Badges -->
    <rect x="155" y="252" width="90" height="18" rx="3" fill="#ffffff" fill-opacity="0.15"/>
    <text x="200" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8.5" fill="#fef08a">COLD BREW COFFEE</text>

    <!-- Key Nutrients -->
    <g transform="translate(155, 278)">
      <rect x="0" y="0" width="42" height="22" rx="3" fill="#0f172a"/>
      <text x="21" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#38bdf8">BCAA</text>
      <text x="21" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="6" fill="#cbd5e1">1425mg</text>

      <rect x="48" y="0" width="42" height="22" rx="3" fill="#0f172a"/>
      <text x="69" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="7.5" fill="#facc15">CAFFEINE</text>
      <text x="69" y="19" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="6" fill="#cbd5e1">35mg</text>
    </g>

    <!-- Net Weight -->
    <text x="200" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8.5" fill="#ffffff">NET WT 32g (1.1 OZ)</text>
  </g>
</svg>