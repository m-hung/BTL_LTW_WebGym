<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="revLiquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <linearGradient id="revLabel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="yellowCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="revShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <g filter="url(#revShadow)">
    <!-- Yellow Cap -->
    <rect x="176" y="44" width="48" height="25" rx="4" fill="url(#yellowCap)" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="184" y1="48" x2="184" y2="65" stroke="#a16207" stroke-width="1.5"/>
    <line x1="192" y1="48" x2="192" y2="65" stroke="#a16207" stroke-width="1.5"/>
    <line x1="200" y1="48" x2="200" y2="65" stroke="#a16207" stroke-width="1.5"/>
    <line x1="208" y1="48" x2="208" y2="65" stroke="#a16207" stroke-width="1.5"/>
    <rect x="172" y="69" width="56" height="8" rx="2" fill="#ca8a04"/>
    <!-- Bottle Shape (Ergonomic sports bottle with grip curves) -->
    <path d="M174 77 L160 120 C146 142 144 165 150 190 C154 210 148 235 144 260 L144 340 C144 354 154 365 168 365 L232 365 C246 365 256 354 256 340 L256 260 C252 235 246 210 250 190 C256 165 254 142 240 120 L226 77 Z" fill="url(#revLiquid)" stroke="#84cc16" stroke-width="2"/>
    <!-- Main Bottle Label -->
    <rect x="145" y="170" width="110" height="130" rx="4" fill="url(#revLabel)"/>
    <!-- Red Swoosh Accent -->
    <path d="M145 200 Q200 220 255 185 L255 195 Q200 230 145 210 Z" fill="#ef4444"/>
    <!-- Revive Text -->
    <text x="200" y="200" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="1">REVIVE</text>
    <!-- Isotonic Badge -->
    <rect x="156" y="210" width="88" height="16" rx="4" fill="#84cc16"/>
    <text x="200" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="8.5" fill="#0f172a" letter-spacing="1">ISOTONIC 7</text>
    <!-- Flavor Subtext -->
    <text x="200" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#fef08a">CHANH MUỐI</text>
    <text x="200" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-weight="600" font-size="7.5" fill="#e0f2fe">BÙ KHOÁNG &amp; NƯỚC</text>
    <text x="200" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="9" fill="#ffffff">500 ml</text>
    <!-- Lemon slice icon -->
    <circle cx="235" cy="272" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <line x1="235" y1="262" x2="235" y2="282" stroke="#ffffff" stroke-width="1"/>
    <line x1="225" y1="272" x2="245" y2="272" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>