<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="leatherStrap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d5b32"/>
      <stop offset="40%" stop-color="#6f421e"/>
      <stop offset="80%" stop-color="#4e2c10"/>
      <stop offset="100%" stop-color="#361c08"/>
    </linearGradient>
    <linearGradient id="metalKnurl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="lsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#lsShadow)">
    <!-- Steel Barbell Knurled Bar in Background -->
    <rect x="30" y="185" width="340" height="30" rx="4" fill="url(#metalKnurl)" stroke="#475569" stroke-width="2"/>
    <line x1="80" y1="185" x2="80" y2="215" stroke="#334155" stroke-width="2"/>
    <line x1="120" y1="185" x2="120" y2="215" stroke="#334155" stroke-width="2"/>
    <line x1="280" y1="185" x2="280" y2="215" stroke="#334155" stroke-width="2"/>
    <line x1="320" y1="185" x2="320" y2="215" stroke="#334155" stroke-width="2"/>

    <!-- Left Lifting Strap Loop & Tail Wrapping Bar -->
    <!-- Wrist Loop (top) -->
    <ellipse cx="140" cy="95" rx="42" ry="52" fill="none" stroke="url(#leatherStrap)" stroke-width="24"/>
    <ellipse cx="140" cy="95" rx="42" ry="52" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4 3"/>
    <!-- Wrap around barbell -->
    <path d="M128 145 L128 260 C128 285 152 285 152 260 L152 145 Z" fill="url(#leatherStrap)"/>
    <line x1="133" y1="145" x2="133" y2="260" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3"/>
    <line x1="147" y1="145" x2="147" y2="260" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Right Lifting Strap (Primary Focus) -->
    <!-- Wrist Loop -->
    <ellipse cx="250" cy="115" rx="44" ry="55" fill="none" stroke="url(#leatherStrap)" stroke-width="26"/>
    <ellipse cx="250" cy="115" rx="44" ry="55" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 3"/>
    
    <!-- Long Heavy-Duty Leather Tail Wrapping Tightly -->
    <path d="M237 165 L225 320 C222 345 252 350 258 325 L263 165 Z" fill="url(#leatherStrap)"/>
    <!-- Heavy Stitching Detail -->
    <line x1="230" y1="170" x2="230" y2="325" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 3"/>
    <line x1="258" y1="170" x2="258" y2="325" stroke="#fcd34d" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Neoprene Wrist Pad (Padded black section) -->
    <rect x="225" y="80" width="50" height="20" rx="4" fill="#18181b"/>
    
    <!-- ROGUE Embossed Patch -->
    <rect x="220" y="210" width="56" height="50" rx="4" fill="#18181b" stroke="#71717a" stroke-width="1"/>
    <text x="248" y="232" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="1">ROGUE</text>
    <text x="248" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="7" fill="#f59e0b" letter-spacing="1">LEATHER</text>
  </g>
</svg>